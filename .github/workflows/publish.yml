name: Publish image

# Builds the server image (multi-arch) and pushes it to GitHub Container
# Registry. The package inherits the repo's visibility — private repo → private
# image, pullable only with a token that has read:packages.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:   # manual "Run workflow" button

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ghcr.io/slimluccii/horizon

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # required to push to GHCR
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4      # emulation for arm64
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: branch/tag name, the git SHA, plus `latest` on the default branch.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
