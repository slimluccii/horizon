name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: typecheck · unit · e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # ffmpeg + ffprobe: required at runtime (transcode + scan probe) and to
      # generate the synthetic playback fixture in the e2e global-setup.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 ships prebuilds, but rebuild against this runner's Node
      # ABI to avoid NODE_MODULE_VERSION mismatches.
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Typecheck (server)
        run: npm run -w apps/server typecheck

      - name: Unit tests (server + sdk)
        run: npm test

      - name: Web build
        run: npm -w @horizon/web run build

      # Playwright drives its own backend + Vite (see playwright.config.ts).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
