# Horizon — single-host stack (Dockge / TrueNAS Apps friendly).
#
# Default: pull the prebuilt multi-arch image from GHCR (private — needs
# `docker login ghcr.io`). The publish workflow pushes amd64 + arm64 on every
# push to main and on v* tags. Pin a tag instead of `latest` for reproducible
# deploys, e.g. ghcr.io/slimluccii/horizon:v1.0.0
#
# To BUILD from source on the host instead (no registry), uncomment `build:`
# below and run `docker compose build`.
#
# After deploy, see docs/DEPLOY.md for TrueNAS + Dockge specifics.

services:
  horizon:
    container_name: horizon
    image: ghcr.io/slimluccii/horizon:latest
    # --- Build from local source instead of pulling ---
    # build:
    #   context: .
    #   dockerfile: apps/server/Dockerfile

    restart: unless-stopped

    # Run as the user that owns the /config host dir (TrueNAS apps user is 568:568).
    # Override via .env. The media mount is read-only so its ownership doesn't matter.
    user: "${PUID:-568}:${PGID:-568}"

    ports:
      - "${HORIZON_PORT:-7777}:7777"

    environment:
      # Everything below is OPTIONAL — the image ships sensible defaults (port
      # 7777, DB + cache under /config, web UI on). A minimal stack needs only
      # the two volume mounts. Library folders are picked at runtime in the web
      # UI; the container only sees what you mount, so the media mount IS the
      # boundary.
      # Optional — set in .env
      HORIZON_TMDB_TOKEN: "${HORIZON_TMDB_TOKEN:-}"
      # Web UI is served same-origin by the server, so CORS defaults to OFF
      # (same-origin only). Set only to allow a separately-hosted client.
      HORIZON_CORS_ORIGINS: "${HORIZON_CORS_ORIGINS:-}"
      # Set to 0 to run headless (no bundled web UI).
      HORIZON_SERVE_WEB: "${HORIZON_SERVE_WEB:-1}"
      HORIZON_MAX_SESSIONS: "${HORIZON_MAX_SESSIONS:-4}"
      HORIZON_MAX_RENDITIONS: "${HORIZON_MAX_RENDITIONS:-3}"
      HORIZON_FORCE_ENCODER: "${HORIZON_FORCE_ENCODER:-}"
      HORIZON_TONEMAP_OPERATOR: "${HORIZON_TONEMAP_OPERATOR:-hable}"
      HORIZON_SCAN_CONCURRENCY: "${HORIZON_SCAN_CONCURRENCY:-4}"
      HORIZON_WATCHED_THRESHOLD_PCT: "${HORIZON_WATCHED_THRESHOLD_PCT:-90}"
      # Rescan engine
      HORIZON_SCAN_CRON_HOUR: "${HORIZON_SCAN_CRON_HOUR:-3}"
      HORIZON_WATCH_FS: "${HORIZON_WATCH_FS:-1}"
      HORIZON_WATCH_DEBOUNCE_MS: "${HORIZON_WATCH_DEBOUNCE_MS:-5000}"
      # Metadata refresh
      HORIZON_METADATA_BATCH_SIZE: "${HORIZON_METADATA_BATCH_SIZE:-50}"
      HORIZON_METADATA_MAX_AGE_MOVIE_DAYS: "${HORIZON_METADATA_MAX_AGE_MOVIE_DAYS:-30}"
      HORIZON_METADATA_MAX_AGE_SHOW_DAYS: "${HORIZON_METADATA_MAX_AGE_SHOW_DAYS:-7}"
      HORIZON_METADATA_MAX_AGE_EPISODE_DAYS: "${HORIZON_METADATA_MAX_AGE_EPISODE_DAYS:-60}"
      TZ: "${TZ:-Europe/Amsterdam}"

    volumes:
      # Media — the host tree holding your movies/shows, mounted read-only at
      # /media. Pick the actual library folders under it at runtime in the web UI.
      # The container only sees what you mount here, so this mount IS the boundary.
      # Host path set in .env (TrueNAS: /mnt/<pool>/...).
      - "${HORIZON_MEDIA_HOST}:/media:ro"
      # Mount more trees if you like — each is browsable in the UI:
      #   - "${HORIZON_MEDIA_HOST2}:/media2:ro"
      # Config + state (SQLite DB = settings/users/library/auth + transcode
      # cache). Point this anywhere — Plex-style :config. Must be owned by PUID:PGID.
      - "${HORIZON_DATA_HOST}:/config"

    # Intel / AMD iGPU passthrough for QSV/VAAPI hardware transcode. On by
    # default — Horizon auto-detects the GPU and falls back to CPU if it can't
    # use it. If your host has NO /dev/dri (no iGPU), comment this block out, or
    # `docker compose up` will fail with "no such file or directory".
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "video"
      - "render"

    # NVIDIA hwaccel instead (requires nvidia-container-toolkit on host) —
    # comment the devices/group_add block above and uncomment this:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
